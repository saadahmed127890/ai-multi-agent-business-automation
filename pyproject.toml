[project]
name = "ai-multi-agent-business-automation"
version = "0.1.0"
description = "Production-style multi-agent AI business automation platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"

authors = [
    { name = "Awais Ahmed" }
]

license = "MIT"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"


[tool.ruff]
line-length = 100
target-version = "py313"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B"
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
