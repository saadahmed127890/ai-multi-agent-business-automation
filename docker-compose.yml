services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: multi-agent-app

    ports:
      - "8000:8000"

    environment:
      APP_NAME: AI Multi-Agent Business Automation
      APP_ENV: development
      DEBUG: "true"

      HOST: 0.0.0.0
      PORT: "8000"

      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2

      DATABASE_URL: sqlite:///./data/business_automation.db

      EXTERNAL_API_BASE_URL: http://mock-api:9100

      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/business-operations

      REQUIRE_HUMAN_APPROVAL: "true"
      LOG_LEVEL: INFO

    volumes:
      - ./data:/app/data

    depends_on:
      - mock-api
      - n8n

    restart: unless-stopped

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: multi-agent-mock-api

    command:
      - uvicorn
      - mock_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "9100"

    ports:
      - "9100:9100"

    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n

    container_name: multi-agent-n8n

    ports:
      - "5678:5678"

    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: UTC

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

    restart: unless-stopped

volumes:
  n8n_data:
    name: n8n_data
